<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="32" fill="url(#purpleBg)" />

  <!-- Elegant eyebrow curve -->
  <path d="M 28 42 C 45 28, 75 28, 92 42 C 78 35, 48 35, 28 42 Z" fill="url(#goldGradient)" />

  <!-- Monogram EM -->
  <text x="60" y="82" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">EM</text>

  <!-- Subtitle dots -->
  <circle cx="52" cy="96" r="2.5" fill="url(#goldGradient)" />
  <circle cx="60" cy="96" r="2.5" fill="url(#goldGradient)" />
  <circle cx="68" cy="96" r="2.5" fill="url(#goldGradient)" />
</svg>
